# Include this file from the nginx http{} context. It is a dedicated, default-deny vhost.
limit_req_zone $binary_remote_addr zone=nma_static:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=nma_results:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=nma_runs:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=nma_per_ip:10m;

upstream nma_demo_gateway {
    server unix:/run/nma-demo/nma-demo.sock max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.geomni.tw;
    location = /nma { return 308 https://demo.geomni.tw/nma/; }
    location ^~ /nma/ { return 308 https://demo.geomni.tw$request_uri; }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.geomni.tw;

    # Set these two paths to the existing protected Cloudflare/origin TLS material.
    ssl_certificate /etc/ssl/demo.geomni.tw/fullchain.pem;
    ssl_certificate_key /etc/ssl/demo.geomni.tw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_conn nma_per_ip 8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    access_log /var/log/nginx/nma-demo-access.log combined;
    error_log /var/log/nginx/nma-demo-error.log warn;

    location = /nma { return 308 /nma/; }

    location = /nma/ {
        limit_req zone=nma_static burst=20 nodelay;
        proxy_pass http://nma_demo_gateway;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
    }

    location ~ ^/nma/assets/[A-Za-z0-9.-]+$ {
        limit_req zone=nma_static burst=20 nodelay;
        proxy_pass http://nma_demo_gateway;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location ~ ^/nma/api/v1/health/(live|ready)$ {
        limit_req zone=nma_results burst=10 nodelay;
        proxy_pass http://nma_demo_gateway;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
    }

    location = /nma/api/v1/scenarios {
        limit_req zone=nma_results burst=10 nodelay;
        proxy_pass http://nma_demo_gateway;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /nma/api/v1/runs {
        if ($request_method != POST) { return 405; }
        limit_req zone=nma_runs burst=2 nodelay;
        proxy_pass http://nma_demo_gateway;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 90s;
        proxy_intercept_errors on;
    }

    location ~ ^/nma/api/v1/runs/[0-9a-f]{32}(/(evidence|map))?$ {
        if ($request_method != GET) { return 405; }
        limit_req zone=nma_results burst=10 nodelay;
        proxy_pass http://nma_demo_gateway;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
    }

    location @nma_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"The controlled demo is temporarily unavailable."}}';
    }

    error_page 502 504 =503 @nma_unavailable;
    location / { return 404; }
}
