name: Deploy bounded NMA public demo to Pages

on:
  push:
    branches:
      - deploy/deploy-02-github-pages-public-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployment branch
        uses: actions/checkout@v4

      - name: Build bounded public artifact
        run: python3 scripts/build_public_site.py --output artifacts/tmp/public-site

      - name: Verify bounded publication contract
        run: |
          test -f artifacts/tmp/public-site/index.html
          test -f artifacts/tmp/public-site/nmaAgentDemo.html
          test -f artifacts/tmp/public-site/release.json
          test -f artifacts/tmp/public-site/.nojekyll
          test "$(find artifacts/tmp/public-site -type f -name '*.pmtiles' | wc -l | tr -d ' ')" = "0"
          grep -q 'PUBLIC_EVIDENCE_ONLY=true' artifacts/tmp/public-site/nmaAgentDemo.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('artifacts/tmp/public-site/release.json').read_text())
          assert release['public_mode'] == 'evidence-only'
          assert release['pmtiles_included'] is False
          assert all(not item['path'].endswith('.pmtiles') for item in release['files'])
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload bounded Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/tmp/public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
