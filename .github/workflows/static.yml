name: Deploy NMA v1.0 static accepted replay to Pages

on:
  push:
    branches:
      - deploy/deploy-02-github-pages-public-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployment branch
        uses: actions/checkout@v4

      - name: Build static accepted-execution replay
        run: python3 scripts/build_gh_pages.py --output artifacts/tmp/gh-pages

      - name: Run focused Pages acceptance tests
        run: python3 -m unittest discover -s tests -p 'test_gh_pages_static_demo.py' -v

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload bounded Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/tmp/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
