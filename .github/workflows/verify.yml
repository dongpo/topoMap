name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests benchmark/adapters
      - run: ruff format --check src tests benchmark/adapters
      - run: pytest -q
      - run: nma demo --approve-safe-repairs
      - run: nma-bench --root .
