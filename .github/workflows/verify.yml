name: AMA Canonical CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canonical:
    name: Current research software
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - name: Install package, test, lint, and build dependencies
        run: python -m pip install 'build>=1.2,<2' '.[dev]'
      - name: Repository and compatibility-version sanity
        run: |
          python - <<'PY'
          import importlib.metadata
          import nma
          assert importlib.metadata.version("national-map-agent") == "0.2.0"
          assert nma.__name__ == "nma"
          PY
      - name: Maintained-scope Ruff check
        run: python scripts/run_maintained_ruff.py check
      - name: Maintained-scope Ruff format check
        run: python scripts/run_maintained_ruff.py format
      - name: Current pytest suite (includes Core and Agent contracts)
        run: python -m pytest -q -m 'not historical_freeze'
      - name: Historical marker discovery sanity
        run: |
          python -m pytest -o addopts='' --collect-only -q -m historical_freeze
          test "$(python -m pytest -o addopts='' --collect-only -q -m historical_freeze | tail -1 | cut -d/ -f1)" = "38"
      - name: PMTiles capability-catalog reproducibility
        run: python -m pytest -q tests/test_agentic_demo_catalog.py::test_pmtiles_capability_catalog_is_reproducible
      - name: ROAD public-state determinism
        run: python scripts/verify_road_authorization_consumption.py
      - name: AMA-Bench deterministic development benchmark
        run: nma-bench --root . --output /tmp/ama-portrayal-benchmark.json
      - name: Knowledge graph and MapLibre style byte reproducibility
        run: |
          mkdir -p /tmp/ama-repro
          nma compile-knowledge --out /tmp/ama-repro/portrayal-graph.json
          cmp data/knowledge/portrayal-graph.json /tmp/ama-repro/portrayal-graph.json
          nma compile-style --out /tmp/ama-repro/maplibre-layers.json
          cmp artifacts/portrayal/maplibre-layers.json /tmp/ama-repro/maplibre-layers.json
      - name: Build wheel and verify isolated install/import
        run: |
          python -m build
          python -m venv /tmp/ama-wheel
          /tmp/ama-wheel/bin/python -m pip install dist/*.whl
          /tmp/ama-wheel/bin/python -c 'import importlib.metadata, nma; assert importlib.metadata.version("national-map-agent") == "0.2.0"'
      - name: CLI help and grounded ask smoke
        run: |
          nma --help
          nma ask '依 NLSC112V5.4，小學的代碼是什麼？'
          nma-bench --help
      - name: GitHub Pages static acceptance
        run: python -m unittest discover -s tests -p 'test_gh_pages_static_demo.py' -v
      - name: Immutable local and remote historical tags
        run: python scripts/verify_historical_tag_integrity.py --remote origin
